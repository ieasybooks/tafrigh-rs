[package]
name = "tafrigh-transcribe"
description = "Pinned transcribe.cpp runtime and Rust bindings with tafrigh's Cohere CUDA fixes."
version = "0.4.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
links = "transcribe"
include = ["src/**", "native/**", "build.rs", "tests/**", "Cargo.toml", "README.md", "LICENSE", "THIRD-PARTY-LICENSES.md"]

[lib]
name = "transcribe_cpp"

[features]
default = ["metal"]
metal = []
cuda = []
vulkan = []
rocm = []
openmp = []
shared = []
dynamic-backends = ["shared"]
serde = ["dep:serde"]

[dependencies]
thiserror.workspace = true
log = "0.4.34"
serde = { workspace = true, features = ["derive"], optional = true }

[build-dependencies]
cmake = "0.1.58"
diffy = { version = "0.5.2", features = ["std"] }
flate2 = "1.1.10"
tar = { version = "0.4.46", default-features = false }
sha2 = "0.11.1"
serde_json.workspace = true

[dev-dependencies]
diffy = { version = "0.5.2", features = ["std"] }
flate2 = "1.1.10"
tar = { version = "0.4.46", default-features = false }
sha2 = "0.11.1"
serde_json.workspace = true
tempfile.workspace = true
