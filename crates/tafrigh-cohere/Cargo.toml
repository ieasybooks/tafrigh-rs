[package]
name = "tafrigh-cohere"
description = "Local Cohere Transcribe Arabic recognition for tafrigh through transcribe.cpp."
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories = ["multimedia::audio", "api-bindings"]

[features]
cuda = ["tafrigh-transcribe/cuda"]

[dependencies]
tafrigh = { path = "../tafrigh", version = "0.4.0", features = ["models"] }
async-trait.workspace = true
reqwest.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tracing.workspace = true
tafrigh-transcribe = { path = "../tafrigh-transcribe", version = "0.4.0" }

[dev-dependencies]
anyhow.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
