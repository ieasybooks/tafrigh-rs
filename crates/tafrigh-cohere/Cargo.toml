[package]
name = "tafrigh-cohere"
description = "Local Cohere Transcribe Arabic recognition for tafrigh through transcribe.cpp."
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories = ["multimedia::audio", "api-bindings"]

[features]
cuda = ["transcribe-cpp/cuda"]

[dependencies]
tafrigh = { path = "../tafrigh", version = "0.4.0" }
async-trait.workspace = true
dirs = "7.0.0"
reqwest.workspace = true
sha2 = "0.11.1"
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "rt", "sync", "time"] }
tracing.workspace = true
transcribe-cpp = "0.4.0"

[dev-dependencies]
anyhow.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tracing-subscriber.workspace = true
wiremock.workspace = true

[lints]
workspace = true
