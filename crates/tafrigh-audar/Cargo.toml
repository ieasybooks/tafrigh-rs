[package]
name = "tafrigh-audar"
description = "Local Audar-ASR V1 Arabic recognition for tafrigh through bundled llama.cpp."
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories = ["multimedia::audio", "api-bindings"]
include = ["src/**", "tests/**", "licenses/**", "Cargo.toml", "LICENSE", "THIRD-PARTY-LICENSES.md"]

[features]
cuda = ["tafrigh-llama/cuda"]

[dependencies]
tafrigh = { path = "../tafrigh", version = "0.5.0", features = ["models"] }
tafrigh-llama = { path = "../tafrigh-llama", version = "0.5.0" }
async-trait.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }

[lints]
workspace = true
