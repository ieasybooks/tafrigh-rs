[package]
name = "tafrigh-llama"
description = "Bundled llama.cpp and mtmd bindings sharing tafrigh-transcribe's ggml runtime."
version = "0.4.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
links = "llama"
include = ["src/**", "native/**", "build.rs", "tests/**", "Cargo.toml", "README.md", "LICENSE", "THIRD-PARTY-LICENSES.md"]

[lib]
name = "llama_cpp_2"

[features]
default = ["metal", "mtmd"]
metal = ["tafrigh-transcribe/metal"]
cuda = ["tafrigh-transcribe/cuda"]
mtmd = []
sampler = []

[dependencies]
tafrigh-transcribe = { path = "../tafrigh-transcribe", version = "0.4.0", default-features = false }
enumflags2 = "0.7.12"
thiserror.workspace = true
tracing.workspace = true
tracing-core = "0.1.36"

[build-dependencies]
bindgen = "0.73.2"
cmake = "0.1.58"
diffy = { version = "0.5.2", features = ["std"] }
flate2 = "1.1.10"
tar = { version = "0.4.46", default-features = false }
sha2 = "0.11.1"
serde_json.workspace = true

[dev-dependencies]
diffy = { version = "0.5.2", features = ["std"] }
flate2 = "1.1.10"
tar = { version = "0.4.46", default-features = false }
sha2 = "0.11.1"
serde_json.workspace = true
tempfile.workspace = true
static_assertions = "1.1.0"
encoding_rs = "0.8.42"
tracing-subscriber = { workspace = true, features = ["json"] }
