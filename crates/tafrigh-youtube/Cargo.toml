[package]
name = "tafrigh-youtube"
description = "Existing YouTube captions for tafrigh, retrieved through yt-dlp with caption and word timings."
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories = ["multimedia::video", "text-processing"]

[dependencies]
tafrigh = { path = "../tafrigh", version = "0.4.0", default-features = false }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs"] }

[lints]
workspace = true
