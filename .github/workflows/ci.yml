name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml, with rustfmt and clippy.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install media tools and Usage CLI
        uses: jdx/mise-action@v5.2.1
        with:
          install_args: ffmpeg yt-dlp usage
      - name: Check workspace versions and release-please dependency names
        run: |
          cargo metadata --no-deps --locked --format-version 1 \
            | jq -e '
              .packages as $packages |
              ([$packages[].version] | unique) as $versions |
              ($versions | length) == 1 and
              all($packages[].dependencies[] |
                  select(.path != null) |
                  select(.name as $name | any($packages[]; .name == $name));
                  .rename == null and .req == ("^" + $versions[0]))'
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The Cohere CLI is behind a feature; check it too (on the CPU, without a model).
      - run: cargo clippy --package tafrigh-cli --all-targets --features cohere --locked -- -D warnings
      - run: cargo test --package tafrigh-cli --features cohere --locked
      # The native source and patches must also build from the published package layout.
      - run: cargo package --package tafrigh-transcribe --locked
      - name: Check generated CLI reference
        run: |
          sh scripts/cli-docs.sh
          git diff --exit-code -- docs/
