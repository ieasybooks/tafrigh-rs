name: Release binaries

# Builds `tafrigh` for each platform and attaches the archives to the GitHub release.
# Manual runs keep artifacts only, unless publishing is explicitly enabled on a release tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Attach archives to this tag's GitHub release
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc requirement low (2.35), so the binaries run on older
          # distributions too.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml, then the target to build for.
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - name: Check the release tag matches the crate version
        if: github.event_name == 'release' || inputs.publish
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "tafrigh-cli") | .version')
          if [ "$GITHUB_REF_TYPE" != tag ] || [ "$TAG" != "v$version" ]; then
            echo "::error::Publishing requires the tag v$version"
            exit 1
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --package tafrigh-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          VERSION: ${{ (github.event_name == 'release' || inputs.publish) && github.ref_name || 'dev' }}
          TARGET: ${{ matrix.target }}
        run: |
          name="tafrigh-$VERSION-$TARGET"
          mkdir "$name"
          cp "target/$TARGET/release/tafrigh" README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: tafrigh-*.tar.gz*
          if-no-files-found: error

  upload:
    name: Attach to the release
    needs: build
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
