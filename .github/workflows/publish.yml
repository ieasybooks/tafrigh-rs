name: Publish to crates.io

# Publishes the crates when a GitHub release is published, using crates.io trusted publishing.
# Manual runs check packages only, unless publishing is explicitly enabled on a release tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this release tag to crates.io
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check the packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Check the release tag matches the crate version
        if: github.event_name == 'release' || inputs.publish
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "tafrigh-cli") | .version')
          if [ "$GITHUB_REF_TYPE" != tag ] || [ "$TAG" != "v$version" ]; then
            echo "::error::Publishing requires the tag v$version"
            exit 1
          fi
      # Builds each crate from its package, as crates.io will (unlike a publish dry run, this
      # also works when the version is already published).
      - run: cargo package --workspace --locked

  publish:
    name: Publish
    needs: check
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    # Only this environment's deployments may publish; crates.io trusts this workflow in it.
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      # The first release of a new crate needs an API token: crates.io only allows trusted
      # publishing for crates that already exist. Remove the secret once trusted publishing is
      # set up for all crates.
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - name: Authenticate with crates.io
        id: auth
        if: env.HAS_TOKEN != 'true'
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish the crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "tafrigh-cli") | .version')
          # Dependencies first. Versions already on crates.io are skipped, so a failed run can be
          # rerun.
          for crate in tafrigh tafrigh-transcribe tafrigh-wit tafrigh-youtube tafrigh-cohere tafrigh-cli; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -A "tafrigh-rs release ($GITHUB_REPOSITORY)" \
              "https://crates.io/api/v1/crates/$crate/$version")
            if [ "$status" = 200 ]; then
              echo "$crate $version is already on crates.io"
            else
              cargo publish --locked --package "$crate"
            fi
          done
