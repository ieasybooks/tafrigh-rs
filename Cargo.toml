[package]
name = "tafrigh-cli"
description = "Command-line transcription of audio, video and playlists into subtitles and text with tafrigh."
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["command-line-utilities", "multimedia::audio"]
include = ["src/**", "docs/**", "!docs/benchmarks/**", "Cargo.toml", "README.md", "LICENSE"]

[[bin]]
name = "tafrigh"
path = "src/main.rs"
doc = false

[features]
## `--transcriber cohere`: Cohere Transcribe Arabic on this machine. Building it needs CMake and a
## C++ compiler.
cohere = ["dep:tafrigh-cohere"]
## Cohere on NVIDIA GPUs. Building it also needs the CUDA toolkit.
cuda = ["cohere", "tafrigh-cohere/cuda"]

[dependencies]
tafrigh = { path = "crates/tafrigh", version = "0.4.0" }
tafrigh-wit = { path = "crates/tafrigh-wit", version = "0.4.0" }
tafrigh-youtube = { path = "crates/tafrigh-youtube", version = "0.4.0" }
tafrigh-cohere = { path = "crates/tafrigh-cohere", version = "0.4.0", optional = true }
anyhow.workspace = true
indicatif.workspace = true
shell-words.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
usage-rs = { version = "7.1.0", features = ["completions", "response-files"] }

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
usage-rs = { version = "7.1.0", features = ["test"] }

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["crates/tafrigh", "crates/tafrigh-wit", "crates/tafrigh-youtube", "crates/tafrigh-cohere", "crates/tafrigh-transcribe", "crates/tafrigh-llama"]
default-members = [".", "crates/tafrigh", "crates/tafrigh-wit", "crates/tafrigh-youtube", "crates/tafrigh-cohere", "crates/tafrigh-transcribe", "crates/tafrigh-llama"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/ieasybooks/tafrigh-rs"
readme = "README.md"
keywords = ["transcription", "speech-to-text", "subtitles", "wit-ai", "silero-vad"]

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
csv = "1.4.0"
futures = "0.3.34"
indicatif = "0.18.6"
rand = "0.10.3"
rustfft = "6.4.1"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shell-words = "1.1.1"
thiserror = "2.0.21"
tempfile = "3.27.0"
tokio = "1.53.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tract-onnx = "0.23.9"
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Audio math converts between sample counts, seconds and PCM freely.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# tract is numerically heavy; keep tests and dev builds usable.
[profile.dev.package.tract-core]
opt-level = 3
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-onnx]
opt-level = 3
[profile.dev.package.tract-hir]
opt-level = 3
