[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/ieasybooks/tafrigh-rs"
readme = "README.md"
keywords = ["transcription", "speech-to-text", "subtitles", "wit-ai", "silero-vad"]

[workspace.dependencies]
tafrigh = { path = "crates/tafrigh", version = "0.0.1" }
tafrigh-wit = { path = "crates/tafrigh-wit", version = "0.0.1" }

anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
csv = "1.4.0"
futures = "0.3.34"
indicatif = "0.18.6"
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shell-words = "1.1.1"
thiserror = "2.0.21"
tempfile = "3.27.0"
tokio = "1.53.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tract-onnx = "0.23.9"
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Audio math converts between sample counts, seconds and PCM freely.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# tract is numerically heavy; keep tests and dev builds usable.
[profile.dev.package.tract-core]
opt-level = 3
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-onnx]
opt-level = 3
[profile.dev.package.tract-hir]
opt-level = 3
